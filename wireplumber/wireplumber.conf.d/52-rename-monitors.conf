monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "Monitor - Acer VG270U X1 (AUX)"
        device.nick = "Acer VG270U X1"
      }
    }
  },
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_05_00.1.hdmi-stereo"
      }
    ]
    actions = {
      update-props = {
        node.description = "Monitor - Acer VG271U M3 (AUX)"
        device.nick = "Acer VG271U M3"
      }
    }
  }
]

