# ~/.config/kitty/kitty.conf

# -------------------------------------------------------
# COLORS — sourced from matugen output
# Re-generated every time you pick a wallpaper
# -------------------------------------------------------
include colors.conf

# -------------------------------------------------------
# FONT
# -------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# Ligatures
font_features JetBrainsMonoNF-Regular +liga +calt
font_features JetBrainsMonoNF-Bold    +liga +calt

# -------------------------------------------------------
# TRANSPARENCY & BLUR
# Blur is handled by Hyprland windowrule (rules.conf)
# -------------------------------------------------------
background_opacity 0.90
dynamic_background_color yes   # bg color from colors.conf drives blur tint

# -------------------------------------------------------
# WINDOW
# -------------------------------------------------------
window_padding_width    12
window_padding_height   10
hide_window_decorations yes    # no titlebar (Hyprland handles it)
remember_window_size    yes
confirm_os_window_close 0

# -------------------------------------------------------
# TAB BAR
# -------------------------------------------------------
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      "{index}: {title}"

# -------------------------------------------------------
# CURSOR
# -------------------------------------------------------
cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# -------------------------------------------------------
# SCROLLBACK
# -------------------------------------------------------
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# -------------------------------------------------------
# URLS
# -------------------------------------------------------
url_style         curly
open_url_with     zen-browser
detect_urls       yes

# -------------------------------------------------------
# PERFORMANCE
# -------------------------------------------------------
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# -------------------------------------------------------
# SHELL INTEGRATION
# -------------------------------------------------------
shell_integration  enabled
allow_remote_control yes    # needed for SIGUSR1 reload from wallpaper.sh

# -------------------------------------------------------
# KEYBINDS
# -------------------------------------------------------
# Tabs
map ctrl+shift+t  new_tab_with_cwd
map ctrl+shift+w  close_tab
map ctrl+shift+l  next_tab
map ctrl+shift+h  previous_tab
map ctrl+shift+,  move_tab_backward
map ctrl+shift+.  move_tab_forward

# Splits (kitty native)
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+]      next_window
map ctrl+shift+[      previous_window

# Font size
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0

# Copy/Paste
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard
