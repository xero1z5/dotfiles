# advertise terminal capabilities for truecolor & kitty features
env TERM xterm-kitty
env COLORTERM truecolor

# shell
shell /bin/zsh

# title
initial_window_title foot

# font (adjust exact family name as needed)
font_family      JetBrains Mono Nerd Font
font_size        15.0
letter_spacing   0.0

# padding
padding_width  25
padding_height 25

# transparency
background_opacity 0.78

# scrollback
scrollback_lines 10000

# cursor
cursor_shape beam
cursor_beam_width 1.5

# keybindings for scroll/search (match your foot bindings)
map Page_Up scrollback_page_up
map Page_Down scrollback_page_down
map ctrl+shift+f launch --type=overlay find-text

# give a sane clipboard behaviour
clipboard_control both

# palette based on fish colours (gruvbox-like neutral palette, tweak if you prefer)
foreground  #ebdbb2
background  #282828
selection_foreground #282828
selection_background #fabd2f

color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# enable ligatures if your patched font supports them
enable_ligatures yes
