# ~/dotfiles/hypr/hyprland/general.conf

# -----------------------------------------------------
# 1. GENERAL LAYOUT
# -----------------------------------------------------

general {
    gaps_in  = 4
    gaps_out = 10

    border_size = 4

    col.active_border   = $primary
    col.inactive_border = $background

    layout = dwindle

    resize_on_border = true
    allow_tearing    = false
}

decoration {
    # 2 = circle, higher = squircle, 4 = very obvious squircle
    # Clear squircles look really off; we use only extra .4 here to make the rounding feel more continuous
    rounding_power = 2.4
    rounding = 20

    blur {
        enabled = true
        xray = true
        special = false
        new_optimizations = true
        size = 10
        passes = 3
        brightness = 1
        noise = 0.05
        contrast = 0.89
        vibrancy = 0.5
        vibrancy_darkness = 0.5
        popups = false
        popups_ignorealpha = 0.6
        input_methods = true
        input_methods_ignorealpha = 0.8
    }

    shadow {
        enabled = true
        ignore_window = true
        range = 50
        offset = 0 4
        render_power = 10
        color = rgba(00000027)
    }

    # Dim
    dim_inactive = true
    dim_strength = 0.05
    dim_special = 0.07
}

# -----------------------------------------------------
# 3. ANIMATIONS (End-4 style)
# -----------------------------------------------------
animations {
    enabled = yes, please :)

    # Curves
    bezier = fluent_decel,  0,    0.2,  0.4, 1
    bezier = easeOutCirc,   0,    0.55, 0.45, 1
    bezier = easeOutCubic,  0.33, 1,    0.68, 1
    bezier = easeInOutSine, 0.37, 0,    0.63, 1

    # Windows
    animation = windowsIn,   1, 3,   fluent_decel, popin 60%
    animation = windowsOut,  1, 3,   fluent_decel, popin 60%
    animation = windowsMove, 1, 3,   fluent_decel

    # Fade
    animation = fadeIn,  1, 2.5, fluent_decel
    animation = fadeOut, 1, 2.5, fluent_decel

    # Layers
    animation = layers,    1, 3,   fluent_decel
    animation = layersIn,  1, 3,   fluent_decel, fade
    animation = layersOut, 1, 2.5, fluent_decel, fade

    # Workspaces
    animation = workspaces,    1, 3.5, easeOutCubic, slide
    animation = workspacesIn,  1, 3.5, easeOutCubic, slide
    animation = workspacesOut, 1, 3.5, easeOutCubic, slide
}

# -----------------------------------------------------
# 4. INPUT
# -----------------------------------------------------
input {
    kb_layout  = us
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll    = true
        disable_while_typing = true
        tap-to-click      = true
    }
}


# -----------------------------------------------------
# 6. LAYOUT
# -----------------------------------------------------
dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

# -----------------------------------------------------
# 7. MISC
# -----------------------------------------------------
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    enable_swallow          = true
    swallow_regex           = ^(kitty)$
    focus_on_activate       = false
    vfr                     = true
}
