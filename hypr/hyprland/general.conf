# ~/dotfiles/hypr/hyprland/general.conf

# -----------------------------------------------------
# 1. General Layout
# -----------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    
    # Colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    
    layout = dwindle
    
    # Use 1 for true
    resize_on_border = 1
}

# -----------------------------------------------------
# 2. Decoration (Shadows & Blur)
# -----------------------------------------------------
decoration {
    rounding = 12
    
    # Shadow (Flat Syntax for compatibility)
    # If on bleeding edge, "drop_shadow" is often renamed to just "shadow"
    # We use "shadow" here. If it fails, change back to "drop_shadow".
    active_opacity = 1.0
    inactive_opacity = 1.0
    
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }

    # Blur Block
    blur {
        enabled = 1
        size = 6
        passes = 3
        new_optimizations = 1
        ignore_opacity = 1
        xray = 1
    }
}

# -----------------------------------------------------
# 3. Animations (End-4 Style)
# -----------------------------------------------------
animations {
    enabled = 1
    
    # Curves
    bezier = fluent_decel, 0, 0.2, 0.4, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    bezier = easeinoutsine, 0.37, 0, 0.63, 1

    # Windows
    animation = windowsIn, 1, 3, fluent_decel, popin 60%
    animation = windowsOut, 1, 3, fluent_decel, popin 60%
    animation = windowsMove, 1, 3, fluent_decel

    # Fade
    animation = fade, 1, 2.5, fluent_decel

    # Workspaces
    animation = workspaces, 1, 3.5, easeOutCubic, slide
}

# -----------------------------------------------------
# 4. Input
# -----------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    
    touchpad {
        natural_scroll = 1
    }
}

# -----------------------------------------------------
# 5. Gestures
# -----------------------------------------------------
# New Syntax for Hyprland v0.51+
gesture = 3, horizontal, workspace
gesture = 3, vertical, workspace
