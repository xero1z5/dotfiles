
# 1. System
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 2. Wallpaper Daemon (Essential for "smooth" transitions)
exec-once = swww-daemon

# 3. Dynamic Monitor Handling (Automatic)
# Make sure you install 'kanshi' and configure ~/.config/kanshi/config
exec-once = kanshi 

# 4. Status Bar (Waybar or Quickshell)
# exec-once = quickshell # If you are using End-4's quickshell
exec-once = waybar

# 5. Lock Screen (Idle)
exec-once = hypridle

# 6. Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# 7. Initialize Wallpaper & Colors (On first boot)
exec-once = hyprpaper
exec-once = bash ~/dotfiles/hypr/scripts/restore-wallpaper.sh
