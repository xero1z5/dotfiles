# -------------------------------------------------------
# GENERAL
# -------------------------------------------------------
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

# -------------------------------------------------------
# BACKGROUND — current wallpaper with blur
# -------------------------------------------------------
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.2
}

