# -------------------------------------------------------
# CLOCK
# -------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "<span font_size='60pt'><b>$(date +"%H:%M")</b></span>"
    color = rgba(255, 255, 255, 0.9)
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# -------------------------------------------------------
# DATE
# -------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# -------------------------------------------------------
# BATTERY
# -------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] echo "$(cat /sys/class/power_supply/BAT0/capacity)%  $(cat /sys/class/power_supply/BAT0/status)"
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -50
    halign = center
    valign = center
}

# -------------------------------------------------------
# PASSWORD INPUT
# -------------------------------------------------------
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(32b799)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(ffffff)
    fade_on_empty = true
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    rounding = 12
    position = 0, -120
    halign = center
    valign = center
}
