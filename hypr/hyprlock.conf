# ~/.config/hypr/hyprlock.conf
# Lock screen config — colors sourced from matugen output

source = ~/.config/hypr/hyprlock-colors.conf

# -------------------------------------------------------
# GENERAL
# -------------------------------------------------------
general {
    hide_cursor      = true
    grace            = 0         # seconds before lock is enforced
    no_fade_in       = false
}

# -------------------------------------------------------
# BACKGROUND
# -------------------------------------------------------
background {
    monitor  =
    # Use the last set wallpaper as the lock screen background
    path     = ~/.cache/matugen/current_wallpaper

    blur_passes  = 3
    blur_size    = 7
    brightness   = 0.6
    contrast     = 0.9
    vibrancy     = 0.2
    vibrancy_darkness = 0.3
}

# -------------------------------------------------------
# CLOCK
# -------------------------------------------------------
label {
    monitor  =
    text     = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    font_size   = 90
    font_family = "JetBrains Mono Nerd Font"
    color    = $text

    position = 0, 200
    halign   = center
    valign   = center
}

label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +"%A, %B %d")"
    font_size   = 20
    font_family = "JetBrains Mono Nerd Font"
    color    = $subtext

    position = 0, 100
    halign   = center
    valign   = center
}

# -------------------------------------------------------
# PASSWORD INPUT
# -------------------------------------------------------
input-field {
    monitor  =
    size     = 300, 55
    position = 0, -100
    halign   = center
    valign   = center

    outline_thickness = 2
    dots_size         = 0.25
    dots_spacing      = 0.20
    dots_center       = true
    dots_rounding     = -1      # -1 = same as outer_rounding

    outer_color  = $border
    inner_color  = $surface
    font_color   = $text
    fade_on_empty = true

    check_color  = $primary
    fail_color   = $error
    fail_text    = "<i>$FAIL <b>($ATTEMPTS)</b></i>"
    fail_transition = 300

    placeholder_text = "<i>Password</i>"
    hide_input       = false
    rounding         = 12

    # Caps lock indicator
    capslock_color   = $error
    capslock_text    = "󰌾 CAPS LOCK"
}

# -------------------------------------------------------
# GREETING LABEL
# -------------------------------------------------------
label {
    monitor  =
    text     = "Hi, $USER"
    font_size   = 16
    font_family = "JetBrains Mono Nerd Font"
    color    = $subtext

    position = 0, -55
    halign   = center
    valign   = center
}
