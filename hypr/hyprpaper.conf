# ~/.config/hypr/hyprpaper.conf
# Static config — wallpaper is set dynamically by wallpaper.sh
# This just sets sensible defaults and a fallback.

# Disable the splash screen
splash = false

# Preload is done at runtime by wallpaper.sh via hyprctl
# But we keep a fallback here so hyprpaper doesn't start blank.
# Update this to your preferred default wallpaper.
preload = ~/Pictures/Wallpapers/default.jpg
wallpaper = ,~/Pictures/Wallpapers/default.jpg

# If you have dual monitors and want different wallpapers per monitor,
# wallpaper.sh handles this automatically by iterating hyprctl monitors.
# To pin a specific wallpaper to a monitor statically:
# wallpaper = HDMI-A-1,~/Pictures/Wallpapers/main.jpg
# wallpaper = eDP-1,~/Pictures/Wallpapers/laptop.jpg
