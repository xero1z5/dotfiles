# ~/.config/hypr/hyprland/colors.conf
# This file is AUTO-GENERATED by matugen on every wallpaper change.
# DO NOT edit manually — your changes will be overwritten.
#
# To regenerate manually, run:
#   matugen image ~/Pictures/Wallpapers/yourwallpaper.jpg
#
# If this file doesn't exist yet (first boot before picking a wallpaper),
# Hyprland will use the fallback colors defined in general.conf directly.

# --- Material You palette (generated by matugen) ---

$primary         = rgb(6750a4)
$on_primary      = rgb(ffffff)
$secondary       = rgb(625b71)
$on_secondary    = rgb(ffffff)
$tertiary        = rgb(7d5260)
$on_tertiary     = rgb(ffffff)
$surface         = rgb(1c1b1f)
$on_surface      = rgb(e6e1e5)
$background      = rgb(1c1b1f)
$on_background   = rgb(e6e1e5)
$error           = rgb(f2b8b5)
$surface_variant = rgb(49454f)
$outline         = rgb(938f99)

# --- Border colors (used in general.conf) ---
$active_border   = rgba(6750a4ee) rgba(7d5260ee) 45deg
$inactive_border = rgba(49454faa)
$urgent_border   = rgba(f2b8b5ee)
